<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 * 0. Error surface — makes runtime failures visible instead of silent
 * ------------------------------------------------------------------ */
const errBox = document.getElementById('err');
function fail(e) {
  console.error(e);
  errBox.style.display = 'block';
  errBox.textContent = (errBox.textContent + '\n' + (e && e.stack ? e.stack : e)).trim();
}
addEventListener('error', (e) => fail(e.error || e.message));
addEventListener('unhandledrejection', (e) => fail(e.reason));

/* ------------------------------------------------------------------ *
 * 1. Renderer / scene / camera
 * ------------------------------------------------------------------ */
const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8eef5, 46, 165);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 500);

// Camera distance adapts to the viewport: narrow/portrait screens pull back so
// the bike is not cropped at the left and right edges.
function homePos() {
  const k = THREE.MathUtils.clamp(0.72 / Math.min(camera.aspect, 1), 1, 1.35);
  return new THREE.Vector3(9.3 * k, 6.0 * k, 11.2 * k);
}
const HOME = homePos();
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 4.2;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* ------------------------------------------------------------------ *
 * 2. Lighting — key / rim / hemisphere + soft contact shadow
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xcbe9ff, 0x6f8f63, 1.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1d8, 2.6);
key.position.set(6.5, 11, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
const S = 9;
key.shadow.camera.left = -S;
key.shadow.camera.right = S;
key.shadow.camera.top = S;
key.shadow.camera.bottom = -S;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.02;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fd4ff, 1.05);
rim.position.set(-8, 6, -7);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-5, 3.5, 8);
scene.add(fill);

/* ------------------------------------------------------------------ *
 * 3. Materials
 * ------------------------------------------------------------------ */
const M = {
  feather:   new THREE.MeshStandardMaterial({ color: 0xf9f7f0, roughness: 0.66, metalness: 0.02 }),
  feather2:  new THREE.MeshStandardMaterial({ color: 0xece7db, roughness: 0.72, metalness: 0.02 }),
  feather3:  new THREE.MeshStandardMaterial({ color: 0xd9d2c2, roughness: 0.78, metalness: 0.02 }),
  beak:      new THREE.MeshStandardMaterial({ color: 0xf5a83c, roughness: 0.36, metalness: 0.05 }),
  beakDeep:  new THREE.MeshStandardMaterial({ color: 0xe08a26, roughness: 0.42, metalness: 0.05 }),
  pouch:     new THREE.MeshStandardMaterial({ color: 0xf7c072, roughness: 0.55, metalness: 0.0 }),
  leg:       new THREE.MeshStandardMaterial({ color: 0xef9a3a, roughness: 0.5, metalness: 0.03 }),
  legDeep:   new THREE.MeshStandardMaterial({ color: 0xd07f26, roughness: 0.55, metalness: 0.03 }),
  eye:       new THREE.MeshStandardMaterial({ color: 0x10161a, roughness: 0.12, metalness: 0.35 }),
  frame:     new THREE.MeshStandardMaterial({ color: 0x18a99b, roughness: 0.26, metalness: 0.62 }),
  frameDark: new THREE.MeshStandardMaterial({ color: 0x0f7d73, roughness: 0.3, metalness: 0.6 }),
  tire:      new THREE.MeshStandardMaterial({ color: 0x24292c, roughness: 0.9, metalness: 0.02 }),
  metal:     new THREE.MeshStandardMaterial({ color: 0xcfd8df, roughness: 0.28, metalness: 0.92 }),
  saddle:    new THREE.MeshStandardMaterial({ color: 0x33393c, roughness: 0.62, metalness: 0.15 }),
  grass:     new THREE.MeshStandardMaterial({ color: 0x77b96c, roughness: 0.92 }),
  rock:      new THREE.MeshStandardMaterial({ color: 0x9aa79b, roughness: 0.95 }),
};

/* ------------------------------------------------------------------ *
 * 4. Small geometry helpers
 * ------------------------------------------------------------------ */
const UP = new THREE.Vector3(0, 1, 0);
const _a = new THREE.Vector3();
const _b = new THREE.Vector3();
const _dir = new THREE.Vector3();

function sphere(r, mat, seg = 26) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(12, seg >> 1)), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function blob(rx, ry, rz, mat, seg = 26) {
  const m = sphere(1, mat, seg);
  m.scale.set(rx, ry, rz);
  return m;
}
function tube(points, radius, mat, radial = 12, closed = false) {
  const curve = new THREE.CatmullRomCurve3(
    points.map((p) => (p.isVector3 ? p : new THREE.Vector3(p[0], p[1], p[2] ?? 0))),
    closed
  );
  const segs = Math.max(10, Math.round(curve.getLength() * 9));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, radius, radial, closed), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const bar = (a, b, r, mat, radial = 12) => tube([a, b], r, mat, radial);

/** Place a unit cylinder (radius 1, height 1, +Y) between two points. */
function setBone(mesh, a, b, radius) {
  _dir.subVectors(b, a);
  const len = Math.max(_dir.length(), 1e-4);
  mesh.position.copy(a).addScaledVector(_dir, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, _dir.divideScalar(len));
  mesh.scale.set(radius, len, radius);
}

/**
 * Smooth tapered tube: a tube whose elliptical cross-section varies along the
 * curve. Used for the bill, pouch, neck and wings — keeps the surface
 * continuous instead of the visible ribbing you get from blended spheres.
 */
function taperedTube(points, radii, mat, { rings = 26, radial = 16 } = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], p[2] ?? 0)));
  const frames = curve.computeFrenetFrames(rings, false);
  const pos = [];
  const nor = [];
  const idx = [];
  const P = new THREE.Vector3();
  const n = new THREE.Vector3();
  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    curve.getPoint(t, P);
    const N = frames.normals[i];
    const B = frames.binormals[i];
    const r = radii(t);
    const ry = Math.max(r[0], 1e-4);
    const rz = Math.max(r[1], 1e-4);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      pos.push(
        P.x + N.x * ca * ry + B.x * sa * rz,
        P.y + N.y * ca * ry + B.y * sa * rz,
        P.z + N.z * ca * ry + B.z * sa * rz
      );
      n.set(0, 0, 0).addScaledVector(N, ca / ry).addScaledVector(B, sa / rz).normalize();
      nor.push(n.x, n.y, n.z);
    }
  }
  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j;
      const b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const lerp = (a, b, t) => a + (b - a) * t;

/* ------------------------------------------------------------------ *
 * 5. Sky dome + ground
 * ------------------------------------------------------------------ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(320, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x74c6e8) },
      midColor: { value: new THREE.Color(0xc9ecf7) },
      botColor: { value: new THREE.Color(0xfdf6e6) },
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vPos;
      uniform vec3 topColor, midColor, botColor;
      void main() {
        float h = normalize(vPos).y;
        vec3 c = mix(botColor, midColor, smoothstep(-0.15, 0.35, h));
        c = mix(c, topColor, smoothstep(0.25, 0.95, h));
        gl_FragColor = vec4(c, 1.0);
      }`,
  })
);
scene.add(sky);

function groundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#8cc97b';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1100; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const r = 4 + Math.random() * 30;
    const rr = 96 + Math.random() * 60;
    const gg = 150 + Math.random() * 70;
    const bb = 84 + Math.random() * 52;
    g.fillStyle = `rgba(${rr | 0},${gg | 0},${bb | 0},0.30)`;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(7, 7);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(220, 96),
  new THREE.MeshStandardMaterial({ map: groundTexture(), color: 0xffffff, roughness: 0.96, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* soft contact shadow under the bike */
function radialTexture(inner = 'rgba(0,0,0,0.42)', outer = 'rgba(0,0,0,0)') {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 4, 128, 128, 124);
  grad.addColorStop(0, inner);
  grad.addColorStop(0.55, 'rgba(0,0,0,0.14)');
  grad.addColorStop(1, outer);
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(7.4, 3.2),
  new THREE.MeshBasicMaterial({ map: radialTexture(), transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.set(0, 0.012, 0);
scene.add(contact);

/* ------------------------------------------------------------------ *
 * 6. Scenery that scrolls to sell the motion
 * ------------------------------------------------------------------ */
const SCENERY_SPAN = 64;

function buildGrass() {
  const N = 900;
  const geo = new THREE.ConeGeometry(0.05, 0.34, 4, 1);
  geo.translate(0, 0.17, 0);
  const inst = new THREE.InstancedMesh(geo, M.grass, N);
  inst.castShadow = true;
  inst.receiveShadow = true;
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const data = [];
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  const p = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * SCENERY_SPAN;
    const z = (Math.random() - 0.5) * 26 + (Math.random() > 0.5 ? 2.6 : -2.6);
    const sc = 0.45 + Math.random() * 0.85;
    data.push({ x, z, sc, rot: Math.random() * Math.PI * 2 });
    q.setFromAxisAngle(UP, data[i].rot);
    p.set(x, 0, z);
    s.set(sc, sc * (0.8 + Math.random() * 0.7), sc);
    m.compose(p, q, s);
    inst.setMatrixAt(i, m);
  }
  inst.instanceMatrix.needsUpdate = true;
  return { mesh: inst, data, m, q, s, p };
}

function buildRocks() {
  const N = 34;
  const geo = new THREE.DodecahedronGeometry(0.26, 0);
  const inst = new THREE.InstancedMesh(geo, M.rock, N);
  inst.castShadow = true;
  inst.receiveShadow = true;
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const data = [];
  for (let i = 0; i < N; i++) {
    data.push({
      x: (Math.random() - 0.5) * SCENERY_SPAN,
      z: (Math.random() - 0.5) * 22 + (Math.random() > 0.5 ? 3.2 : -3.2),
      sc: 0.4 + Math.random() * 1.5,
      rot: Math.random() * Math.PI,
    });
  }
  return { mesh: inst, data };
}

const grass = buildGrass();
scene.add(grass.mesh);
const rocks = buildRocks();
scene.add(rocks.mesh);

/* clouds */
const clouds = new THREE.Group();
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, transparent: true, opacity: 0.94 });
for (let i = 0; i < 8; i++) {
  const c = new THREE.Group();
  const puffs = 3 + ((Math.random() * 3) | 0);
  for (let j = 0; j < puffs; j++) {
    const m = blob(1.6 + Math.random() * 1.4, 0.9 + Math.random() * 0.7, 1.2 + Math.random() * 0.8, cloudMat, 16);
    m.position.set((j - puffs / 2) * 1.5 + Math.random(), Math.random() * 0.5, Math.random() * 0.8);
    m.castShadow = false;
    c.add(m);
  }
  c.position.set((Math.random() - 0.5) * 90, 12 + Math.random() * 8, -34 + Math.random() * 18);
  c.userData.speed = 0.25 + Math.random() * 0.5;
  clouds.add(c);
}
scene.add(clouds);

/* distant tree line — cheap silhouettes that add depth */
const trees = new THREE.Group();
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a6146, roughness: 0.95 });
const crownMat = new THREE.MeshStandardMaterial({ color: 0x63a55a, roughness: 0.95 });
const crownMat2 = new THREE.MeshStandardMaterial({ color: 0x559947, roughness: 0.95 });
function addTree(x, z, scale) {
  const h = 1.9 * scale;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13 * scale, 0.2 * scale, h, 7), trunkMat);
  trunk.position.set(x, h / 2, z);
  trees.add(trunk);
  const puffs = 3 + ((Math.random() * 2) | 0);
  for (let i = 0; i < puffs; i++) {
    const crown = blob(
      (0.72 + Math.random() * 0.45) * scale,
      (0.62 + Math.random() * 0.4) * scale,
      (0.72 + Math.random() * 0.45) * scale,
      i % 2 ? crownMat2 : crownMat,
      14
    );
    crown.position.set(
      x + (Math.random() - 0.5) * 0.9 * scale,
      h + (0.35 + Math.random() * 0.85) * scale,
      z + (Math.random() - 0.5) * 0.7 * scale
    );
    trees.add(crown);
  }
}
for (let i = 0; i < 18; i++) {
  const side = i % 2 === 0 ? 1 : -1;
  addTree((Math.random() - 0.5) * 110, side * (26 + Math.random() * 26), 1.1 + Math.random() * 1.6);
}
scene.add(trees);

/* ------------------------------------------------------------------ *
 * 7. The bicycle
 * ------------------------------------------------------------------ */
const WHEEL_R = 1.0;
const REAR_HUB = new THREE.Vector3(-1.3, 1.0, 0);
const FRONT_HUB = new THREE.Vector3(1.3, 1.0, 0);
const BB = new THREE.Vector3(0, 0.92, 0);          // bottom bracket
const SEAT_TOP = new THREE.Vector3(-0.42, 2.36, 0);
const SADDLE = new THREE.Vector3(-0.56, 2.8, 0);
const HEAD_TOP = new THREE.Vector3(0.86, 2.34, 0);
const HEAD_BOT = new THREE.Vector3(0.98, 1.72, 0);
const GRIP_Z = 0.34;
const GRIP = new THREE.Vector3(1.18, 2.7, GRIP_Z);
const CRANK_R = 0.42;

const bike = new THREE.Group();
scene.add(bike);

function makeWheel(hub) {
  const g = new THREE.Group();
  g.position.copy(hub);

  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.055, 0.062, 14, 72), M.tire);
  tire.castShadow = true;
  tire.receiveShadow = true;
  g.add(tire);

  const rimGeo = new THREE.TorusGeometry(WHEEL_R - 0.135, 0.024, 8, 72);
  const rimMesh = new THREE.Mesh(rimGeo, M.metal);
  rimMesh.castShadow = true;
  g.add(rimMesh);

  const hubMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.2, 14), M.metal);
  hubMesh.rotation.x = Math.PI / 2;
  hubMesh.castShadow = true;
  g.add(hubMesh);

  const spokeGeo = new THREE.CylinderGeometry(0.011, 0.011, WHEEL_R - 0.16, 5);
  spokeGeo.translate(0, (WHEEL_R - 0.16) / 2, 0);
  const spokes = new THREE.InstancedMesh(spokeGeo, M.metal, 28);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const one = new THREE.Vector3(1, 1, 1);
  const zero = new THREE.Vector3();
  for (let i = 0; i < 28; i++) {
    q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), (i / 28) * Math.PI * 2);
    m.compose(zero, q, one);
    spokes.setMatrixAt(i, m);
  }
  spokes.castShadow = true;
  g.add(spokes);

  return g;
}

const rearWheel = makeWheel(REAR_HUB);
const frontWheel = makeWheel(FRONT_HUB);
bike.add(rearWheel, frontWheel);

/* frame — classic diamond, drawn as tubes */
const frameParts = new THREE.Group();
bike.add(frameParts);
frameParts.add(
  bar(REAR_HUB, BB, 0.062, M.frame),            // chainstay
  bar(REAR_HUB, SEAT_TOP, 0.052, M.frame),      // seat stay
  bar(SEAT_TOP, BB, 0.072, M.frame),            // seat tube
  bar(BB, HEAD_BOT, 0.078, M.frame),            // down tube
  bar(SEAT_TOP, HEAD_TOP, 0.07, M.frame),       // top tube
  bar(HEAD_TOP, HEAD_BOT, 0.085, M.frameDark),  // head tube
  bar(HEAD_BOT, FRONT_HUB, 0.05, M.frame)       // fork
);

/* seat post + saddle */
bike.add(bar(SEAT_TOP, SADDLE, 0.045, M.metal));
const saddle = new THREE.Group();
saddle.position.copy(SADDLE);
const saddleSeat = blob(0.30, 0.075, 0.17, M.saddle, 22);
saddleSeat.position.set(-0.02, 0.04, 0);
const saddleNose = blob(0.17, 0.06, 0.11, M.saddle, 18);
saddleNose.position.set(0.2, 0.04, 0);
saddle.add(saddleSeat, saddleNose);
bike.add(saddle);

/* stem + handlebar (mirrored in Z) */
bike.add(bar(HEAD_TOP, new THREE.Vector3(0.8, 2.62, 0), 0.048, M.metal));
for (const s of [1, -1]) {
  bike.add(
    tube(
      [
        [0.8, 2.62, 0],
        [0.95, 2.7, 0.16 * s],
        [1.1, 2.72, 0.28 * s],
        [GRIP.x, GRIP.y, GRIP_Z * s],
      ],
      0.045,
      M.saddle
    )
  );
  const gripCap = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.16, 14), M.frameDark);
  gripCap.position.set(GRIP.x + 0.03, GRIP.y - 0.005, GRIP_Z * s);
  gripCap.rotation.z = Math.PI / 2;
  gripCap.castShadow = true;
  bike.add(gripCap);
}

/* chainring + chain + cog */
const chainring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.026, 8, 40), M.metal);
chainring.position.copy(BB);
chainring.castShadow = true;
bike.add(chainring);
const cog = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.022, 8, 28), M.metal);
cog.position.set(REAR_HUB.x, REAR_HUB.y, 0);
bike.add(cog);
bike.add(bar(new THREE.Vector3(BB.x, BB.y + 0.3, 0.03), new THREE.Vector3(REAR_HUB.x, REAR_HUB.y + 0.13, 0.03), 0.016, M.metal, 6));
bike.add(bar(new THREE.Vector3(BB.x, BB.y - 0.3, 0.03), new THREE.Vector3(REAR_HUB.x, REAR_HUB.y - 0.13, 0.03), 0.016, M.metal, 6));

/* cranks + pedals (positions are driven every frame) */
const crankArmGeo = new THREE.CylinderGeometry(0.042, 0.042, 1, 10);
const crankArms = [0, 1].map(() => {
  const m = new THREE.Mesh(crankArmGeo, M.metal);
  m.castShadow = true;
  bike.add(m);
  return m;
});
const pedalGeo = new THREE.BoxGeometry(0.26, 0.045, 0.16);
const pedals = [0, 1].map(() => {
  const m = new THREE.Mesh(pedalGeo, M.saddle);
  m.castShadow = true;
  m.receiveShadow = true;
  bike.add(m);
  return m;
});

/* ------------------------------------------------------------------ *
 * 8. The pelican
 * ------------------------------------------------------------------ */
const pelican = new THREE.Group();
scene.add(pelican);

const BODY_C = new THREE.Vector3(-0.52, 3.3, 0);
const HIP = [new THREE.Vector3(-0.02, 3.02, 0.3), new THREE.Vector3(-0.02, 3.02, -0.3)];
const SHOULDER = [new THREE.Vector3(0.06, 3.46, 0.4), new THREE.Vector3(0.06, 3.46, -0.4)];
const HEAD_C = new THREE.Vector3(0.66, 4.22, 0);

/* body */
const body = blob(0.92, 0.74, 0.66, M.feather, 36);
body.position.copy(BODY_C);
body.rotation.z = -0.12;
pelican.add(body);

/* chest / belly */
const belly = blob(0.66, 0.5, 0.56, M.feather2, 28);
belly.position.set(0, 2.98, 0);
pelican.add(belly);

/* tail feathers fanning back and up */
const tail = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const f = blob(0.32, 0.085, 0.13, i === 1 ? M.feather2 : M.feather3, 16);
  f.position.set(-1.42 + i * 0.02, 3.38 + i * 0.12, (i - 1) * 0.1);
  f.rotation.z = 0.26 + i * 0.11;
  tail.add(f);
}
pelican.add(tail);

/* neck — one smooth tapered tube from the shoulders to the skull */
const neck = taperedTube(
  [
    [-0.02, 3.56],
    [0.16, 3.82],
    [0.34, 4.0],
    [0.46, 4.12],
    [0.56, 4.19],
  ],
  (t) => {
    const r = lerp(0.27, 0.165, t);
    return [r, r];
  },
  M.feather,
  { rings: 22, radial: 18 }
);
pelican.add(neck);

/* head */
const head = new THREE.Group();
head.position.copy(HEAD_C);
pelican.add(head);
const skull = blob(0.3, 0.29, 0.28, M.feather, 32);
head.add(skull);

/* crest */
const crest = blob(0.1, 0.15, 0.08, M.feather2, 12);
crest.position.set(-0.12, 0.24, 0);
crest.rotation.z = 0.55;
head.add(crest);

/* eyes */
for (const s of [1, -1]) {
  const eye = sphere(0.062, M.eye, 18);
  eye.position.set(0.1, 0.06, 0.21 * s);
  head.add(eye);
  const glint = sphere(0.02, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.1 }), 10);
  glint.position.set(0.13, 0.095, 0.245 * s);
  head.add(glint);
  const brow = blob(0.085, 0.028, 0.045, M.feather2, 10);
  brow.position.set(0.09, 0.15, 0.2 * s);
  head.add(brow);
}

/* beak — long, low, wide upper mandible that hooks down at the tip */
const upperBeak = taperedTube(
  [
    [0.2, 0.03],
    [0.58, -0.01],
    [0.94, -0.09],
    [1.2, -0.21],
    [1.3, -0.35],
  ],
  (t) => [lerp(0.078, 0.024, t), lerp(0.155, 0.045, t)],
  M.beak,
  { rings: 26, radial: 18 }
);
head.add(upperBeak);

/* pouch — smooth sack slung beneath the mandible */
const pouch = taperedTube(
  [
    [0.18, -0.06],
    [0.5, -0.2],
    [0.84, -0.26],
    [1.06, -0.23],
    [1.2, -0.16],
  ],
  (t) => {
    const bulge = Math.sin(Math.PI * Math.min(1, t * 1.02 + 0.06));
    return [0.06 + bulge * 0.235, lerp(0.15, 0.05, t)];
  },
  M.pouch,
  { rings: 26, radial: 18 }
);
head.add(pouch);

/* throat where the pouch meets the neck */
const throat = blob(0.15, 0.14, 0.14, M.pouch, 16);
throat.position.set(0.14, -0.1, 0);
head.add(throat);

/* wings — folded blades sweeping forward to the grips */
function makeWing(side) {
  const g = new THREE.Group();
  const shoulder = SHOULDER[side > 0 ? 0 : 1];
  const grip = new THREE.Vector3(GRIP.x, GRIP.y + 0.02, GRIP_Z * side);

  // the blade starts inside the body volume, so no separate shoulder blob is
  // needed — a discrete ball there reads as a lump stuck on the chest
  const path = [
    [-0.14, shoulder.y + 0.06, shoulder.z * 0.94],
    [shoulder.x + 0.16, shoulder.y - 0.08, shoulder.z * 1.03],
    [0.46, 3.32, shoulder.z * 1.05],
    [0.72, 3.12, GRIP_Z * side * 1.18],
    [0.94, 2.94, GRIP_Z * side * 1.08],
    [grip.x - 0.05, grip.y + 0.17, GRIP_Z * side],
    [grip.x, grip.y + 0.01, GRIP_Z * side],
  ];
  // flat feathered blade: wide in the XY plane, thin across Z
  const blade = taperedTube(path, (t) => [lerp(0.275, 0.082, t), lerp(0.095, 0.034, t)], M.feather2, {
    rings: 34,
    radial: 16,
  });
  g.add(blade);

  // covert layer: a slimmer blade lifted off the main one, so the wing reads as
  // layered feathers instead of a single smooth cone
  const coverts = taperedTube(
    path.slice(0, 5),
    (t) => [lerp(0.15, 0.055, t), lerp(0.048, 0.024, t)],
    M.feather3,
    { rings: 26, radial: 12 }
  );
  coverts.position.z = 0.055 * side;
  g.add(coverts);

  // primary feather tips curling over the grip
  for (let i = 0; i < 3; i++) {
    const wobble = (i - 1) * 0.028;
    const tip = taperedTube(
      [
        [grip.x - 0.16, grip.y + 0.14 - i * 0.012, GRIP_Z * side + wobble],
        [grip.x - 0.03, grip.y + 0.04 - i * 0.03, GRIP_Z * side + wobble],
        [grip.x + 0.11, grip.y - 0.04 - i * 0.045, GRIP_Z * side + wobble],
      ],
      (t) => [lerp(0.05, 0.016, t), lerp(0.07, 0.022, t)],
      i === 0 ? M.feather3 : M.feather2,
      { rings: 12, radial: 12 }
    );
    g.add(tip);
  }
  return g;
}
pelican.add(makeWing(1), makeWing(-1));

/* legs — upper segment is a mesh we re-aim each frame via IK */
const LEG = { thigh: 1.3, shin: 1.3 };

function makeLeg(index) {
  const side = index === 0 ? 1 : -1;
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 1, 14), M.leg);
  const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.9, 1, 12), M.leg);
  const knee = sphere(0.125, M.leg, 14);
  const ankle = sphere(0.082, M.leg, 12);
  [thigh, shin, knee, ankle].forEach((m) => { m.castShadow = true; m.receiveShadow = true; pelican.add(m); });

  // feathered "trousers" at the hip
  const hipFeather = blob(0.24, 0.22, 0.22, M.feather2, 16);
  hipFeather.position.copy(HIP[index]);
  pelican.add(hipFeather);

  // webbed foot
  const foot = new THREE.Group();
  const sole = blob(0.19, 0.045, 0.15, M.legDeep, 14);
  foot.add(sole);
  for (let i = 0; i < 3; i++) {
    const toe = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.016, 0.24, 6), M.legDeep);
    toe.rotation.z = Math.PI / 2;
    toe.rotation.y = (i - 1) * 0.45;
    toe.position.set(0.17, 0, (i - 1) * 0.09);
    toe.castShadow = true;
    foot.add(toe);
  }
  pelican.add(foot);

  return { thigh, shin, knee, ankle, foot, side };
}
const legs = [makeLeg(0), makeLeg(1)];

/* two-bone IK: hip → pedal, knee bending forward */
const _t = new THREE.Vector3();
const _perp = new THREE.Vector3();
function kneeFor(hip, target, L1, L2, out) {
  _t.subVectors(target, hip);
  let d = _t.length();
  const maxD = (L1 + L2) * 0.998;
  if (d > maxD) {
    d = maxD;
    _t.setLength(d);
  }
  const dir = _t.clone().divideScalar(d || 1);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  _perp.set(-dir.y, dir.x, 0).normalize();
  if (_perp.x < 0) _perp.negate();
  out.copy(hip).addScaledVector(dir, a).addScaledVector(_perp, h);
  return out;
}

/* ------------------------------------------------------------------ *
 * 9. Animation state + UI
 * ------------------------------------------------------------------ */
const state = {
  playing: !window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  speed: 1,
  crank: 0,
  travel: 0,
  time: 0,
};

const btnPlay = document.getElementById('btnPlay');
const btnOrbit = document.getElementById('btnOrbit');
const speedInput = document.getElementById('speed');

function syncPlayUI() {
  btnPlay.textContent = state.playing ? '暂停' : '播放';
  btnPlay.setAttribute('aria-pressed', String(!state.playing));
}
btnPlay.addEventListener('click', () => {
  state.playing = !state.playing;
  syncPlayUI();
});
addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    state.playing = !state.playing;
    syncPlayUI();
  }
});
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.setAttribute('aria-pressed', String(controls.autoRotate));
});
speedInput.addEventListener('input', () => { state.speed = parseFloat(speedInput.value); });

function flyTo(pos, target) {
  camera.position.copy(pos);
  controls.target.copy(target);
  controls.update();
}
document.getElementById('btnSide').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.setAttribute('aria-pressed', 'false');
  flyTo(new THREE.Vector3(0.4, 3.0, 11.5), new THREE.Vector3(0.1, 2.7, 0));
});
document.getElementById('btnFront').addEventListener('click', () => {
  controls.autoRotate = false;
  btnOrbit.setAttribute('aria-pressed', 'false');
  flyTo(new THREE.Vector3(11.0, 3.2, 0.6), new THREE.Vector3(0.3, 2.7, 0));
});
document.getElementById('btnReset').addEventListener('click', () => {
  controls.autoRotate = true;
  btnOrbit.setAttribute('aria-pressed', 'true');
  speedInput.value = '1';
  state.speed = 1;
  flyTo(homePos(), new THREE.Vector3(0.1, 2.7, 0));
});
renderer.domElement.addEventListener('dblclick', () => flyTo(homePos(), new THREE.Vector3(0.1, 2.7, 0)));

/* ------------------------------------------------------------------ *
 * 10. Frame loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const pedalPos = [new THREE.Vector3(), new THREE.Vector3()];
const kneePos = [new THREE.Vector3(), new THREE.Vector3()];
const tmpA = new THREE.Vector3();
const tmpB = new THREE.Vector3();

function updateLegs() {
  for (let i = 0; i < 2; i++) {
    const leg = legs[i];
    const hip = HIP[i];
    const pedal = pedalPos[i];

    kneeFor(hip, pedal, LEG.thigh, LEG.shin, kneePos[i]);

    setBone(leg.thigh, hip, kneePos[i], 0.135);
    setBone(leg.shin, kneePos[i], pedal, 0.083);
    leg.knee.position.copy(kneePos[i]);
    leg.ankle.position.copy(pedal).add(new THREE.Vector3(-0.02, 0.04, 0));
    leg.foot.position.copy(pedal).add(new THREE.Vector3(0.06, 0.06, 0));
    leg.foot.rotation.z = 0;
  }
}

function updatePedals(crankAngle) {
  for (let i = 0; i < 2; i++) {
    const phase = crankAngle + (i === 0 ? 0 : Math.PI);
    pedalPos[i].set(
      BB.x + Math.cos(phase) * CRANK_R,
      BB.y + Math.sin(phase) * CRANK_R,
      0.3 * (i === 0 ? 1 : -1)
    );
    setBone(crankArms[i], BB, pedalPos[i], 0.045);
    pedals[i].position.copy(pedalPos[i]);
    pedals[i].rotation.z = 0;
  }
}

function updateScenery(dx) {
  // grass
  const { mesh, data, m, q, s, p } = grass;
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    d.x -= dx;
    if (d.x < -SCENERY_SPAN / 2) d.x += SCENERY_SPAN;
    q.setFromAxisAngle(UP, d.rot);
    p.set(d.x, 0, d.z);
    s.set(d.sc, d.sc * 1.05, d.sc);
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
  }
  mesh.instanceMatrix.needsUpdate = true;

  // rocks
  for (let i = 0; i < rocks.data.length; i++) {
    const d = rocks.data[i];
    d.x -= dx * 0.98;
    if (d.x < -SCENERY_SPAN / 2) d.x += SCENERY_SPAN;
    q.setFromAxisAngle(UP, d.rot);
    p.set(d.x, 0.12 * d.sc, d.z);
    s.set(d.sc, d.sc, d.sc);
    m.compose(p, q, s);
    rocks.mesh.setMatrixAt(i, m);
  }
  rocks.mesh.instanceMatrix.needsUpdate = true;

  // clouds drift independently
  for (const c of clouds.children) {
    c.position.x -= dx * 0.055 * c.userData.speed;
    if (c.position.x < -46) c.position.x = 46;
  }
}

let firstFrame = true;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  const v = state.playing ? state.speed : 0;
  const dTravel = v * 5.4 * dt;      // world units per second at speed 1
  state.travel += dTravel;
  state.crank += (dTravel / WHEEL_R) * 0.42;

  rearWheel.rotation.z = -state.travel / WHEEL_R;
  frontWheel.rotation.z = -state.travel / WHEEL_R;

  updatePedals(state.crank);
  updateLegs();

  // gentle life: bob, sway, head bob
  const bob = Math.sin(state.crank * 2) * 0.028;
  pelican.position.y = bob;
  body.rotation.z = -0.1 + Math.sin(state.crank) * 0.014;
  head.position.y = HEAD_C.y + Math.sin(state.crank * 2 + 0.6) * 0.045;
  head.rotation.z = Math.sin(state.crank + 1.1) * 0.03;
  tail.rotation.z = Math.sin(state.crank * 0.8) * 0.05;
  bike.position.y = bob * 0.35;

  updateScenery(dTravel);

  controls.update();
  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    document.getElementById('loader').classList.add('done');
    console.log('[pelican] scene ready', renderer.info.render.triangles, 'triangles');
  }
}
renderer.setAnimationLoop(tick);

/* ------------------------------------------------------------------ *
 * 11. Resize
 * ------------------------------------------------------------------ */
addEventListener('resize', () => {
  const wasHome = camera.position.distanceTo(controls.target) < 26;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (wasHome) flyTo(homePos(), controls.target.clone());
});

syncPlayUI();
window.__pelican = { scene, renderer, camera, controls, state, legs, pedalPos };
</script>
